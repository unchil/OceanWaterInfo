<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OceanWaterInformation</title>
    <link rel="stylesheet"  href="style.css" />

</head>
<body >



<div class="main-tab-row">
    <button class="main-tab active" onclick="switchMainTab(this, 0)">Seoul/Gyonggi SDoT Information</button>
    <button class="main-tab " onclick="switchMainTab(this, 1)">Korea Ocean Information</button>

</div>



<div id="section-sdot" class="tab-content" >

    <h2 class="compose-title">Seoul/Gyonggi Air Environmental Observation Information</h2>


    <div class="tab-row">
        <button class="tab-item active" onclick="changeTab(this, 'o3')">Ozone(O3)</button>
        <button class="tab-item" onclick="changeTab(this, 'no2')">Nitrogen dioxide(NO2)</button>
        <button class="tab-item" onclick="changeTab(this, 'co')">Carbon monoxide(CO)</button>
        <button class="tab-item" onclick="changeTab(this, 'so2')">Sulfur dioxide(SO2)</button>
        <button class="tab-item" onclick="changeTab(this, 'nh3')">Ammonia(NH3)</button>
        <button class="tab-item" onclick="changeTab(this, 'h2s')">Hydrogen sulfide(H2S)</button>
        <button class="tab-item" onclick="changeTab(this, 'pm10')">Particulate Matter(PM10)</button>
        <button class="tab-item" onclick="changeTab(this, 'pm25')">Particulate Matter(PM2.5)</button>
    </div>


    <div id="info-sidebar" class="sidebar-wrapper">
        <div class="sidebar-handle" onclick="toggleSidebar()">
            <span id="handle-icon">ⓘ</span>
            <span class="handle-text">INFO</span>
        </div>

        <div class="sidebar-content">
            <div class="sidebar-header">
                <h3>Information</h3>
            </div>
            <div id="description-text">

            </div>
        </div>
    </div>



    <iframe id="map-iframe"
            src="sDoTDeckHexagonLayer2.html"
            title="Seoul/Gyonggi Air Quality Information"
            >

    </iframe>

</div>




<div id="section-ocean" class="tab-content"  style="visibility: hidden; display:none;" >

    <h2 class="compose-title">Korea Ocean Water Information</h2>

    <div id="webmain" >
        <div id="compose-container">
            <!-- 여기에 나중에 composeApp.js가 들어갑니다 -->
            <!--   <script type="application/javascript" src="composeApp.js"></script> -->
        </div>
    </div>

    <div id="waterInfoMap" >
        <iframe id="iframe_waterInfo" src="waterInfoGoogleMap.html" title="" style="flex-grow: 1; border: none; display: flex; "></iframe>
    </div>


</div>


<script>



document.addEventListener( "DOMContentLoaded", function() {


    const mapIframe = document.getElementById('map-iframe');
    const oceanSection = document.getElementById('section-ocean');
    const composeContainer = document.getElementById('compose-container');


    mapIframe.addEventListener('load', function() {
        oceanSection.style.display = 'flex';
        oceanSection.style.visibility = 'hidden';
        oceanSection.style.position = 'absolute';

        const script = document.createElement('script');
        script.type = 'application/javascript';
        script.src = 'composeApp.js'; // 실제 파일 경로

        script.onload = function() {
        console.log("composeApp.js 로드 완료!");

        };
        composeContainer.appendChild(script);

    }, { once: true });

    const textElem = document.getElementById('description-text');
    const sidebarTitle = document.querySelector('.sidebar-header h3');

    if (qualityDescriptions['o3']) {
        textElem.innerText = qualityDescriptions['o3'];
        if (sidebarTitle) sidebarTitle.innerText = "Ozone(O3)";
    }


    startAutoRefresh();

});


function toggleSidebar() {
    const sidebar = document.getElementById('info-sidebar');
    const icon = document.getElementById('handle-icon');

    sidebar.classList.toggle('active');

    // 열리고 닫힐 때 아이콘 변경 (선택 사항)
    if (sidebar.classList.contains('active')) {
        icon.innerText = '◀';
    } else {
        icon.innerText = 'ⓘ';
    }
}



        // 현재 선택된 타입을 추적하기 위한 변수 (초기값 o3)
    let currentSelectedType = 'o3';

    function switchMainTab(element, index) {
        // 1. 모든 메인 탭 활성화 해제
        const mainTabs = document.querySelectorAll('.main-tab');
        mainTabs.forEach(tab => tab.classList.remove('active'));

        // 2. 클릭한 탭 활성화
        element.classList.add('active');

        // 3. 섹션 전환
        const sdotSection = document.getElementById('section-sdot');
        const oceanSection = document.getElementById('section-ocean');


        if (index === 0) { // Seoul/Gyonggi 선택 시
            sdotSection.style.display = 'flex';
            sdotSection.style.visibility = 'visible';
            sdotSection.style.position = 'static';
            oceanSection.style.display = 'flex'; // flex 유지
            oceanSection.style.visibility = 'hidden'; // 숨김
            oceanSection.style.position = 'absolute'; // 공간 차지 방지
        } else {   // Korea Ocean 선택 시
            // Ocean은 보이고 SDoT은 숨김
            oceanSection.style.display = 'flex';
            oceanSection.style.visibility = 'visible';
            oceanSection.style.position = 'static';
            sdotSection.style.display = 'flex'; // flex 유지
            sdotSection.style.visibility = 'hidden'; // 숨김
            sdotSection.style.position = 'absolute'; // 공간 차지 방지
        }

        // 필요 시 Compose 측에 상태 변경을 알리는 로직을 추가할 수 있습니다.
        console.log("Main Tab Switched to:", index);
    }


    function changeTab(element, type) {
            // 현재 선택된 타입 업데이트
        currentSelectedType = type;

        // 1. 모든 탭에서 'active' 클래스 제거
        const tabs = document.querySelectorAll('.tab-item');
        tabs.forEach(tab => tab.classList.remove('active'));

        // 2. 클릭된 탭에 'active' 클래스 추가
        element.classList.add('active');

            // 클릭된 버튼(element)의 텍스트를 가져와서 사이드바의 h3에 할당합니다.
        const sidebarTitle = document.querySelector('.sidebar-header h3');
        if (sidebarTitle) {
            sidebarTitle.innerText = element.innerText;
        }


            // --- 추가: 설명 텍스트 업데이트 ---
    const textElem = document.getElementById('description-text');
    if (qualityDescriptions[type]) {
        textElem.innerText = qualityDescriptions[type];
    }


        // 3. iframe의 ID를 가져와서 src 변경
        const iframe = document.getElementById('map-iframe');

        //페이지 새로고침 없이 함수만 호출하고 싶을 때
        //src를 바꾸는 대신 메시지를 보냄
        iframe.contentWindow.postMessage({ action: 'CHANGE_TYPE', type: type }, '*');


    }

    // --- [추가] 30분 간격 자동 리프레시 로직 ---
    function startAutoRefresh() {
        //const THIRTY_MINUTES = 5 * 60 * 1000; // 5분을 밀리초로 계산
        const THIRTY_MINUTES = 1 * 60 * 1000; // 1분을 밀리초로 계산
        setInterval(() => {
            const iframe = document.getElementById('map-iframe');
            if (iframe) {
                console.log(`[자동 갱신] ${new Date().toLocaleTimeString()} - ${currentSelectedType} 데이터를 새로 고침합니다.`);

                // 방법 A: postMessage로 내부 함수 호출 (깜빡임 없음)
                iframe.contentWindow.postMessage({ action: 'CHANGE_TYPE', type: currentSelectedType }, '*');

                /*
                방법 B: 만약 페이지 전체를 새로고침하고 싶다면 아래 주석 해제 (깜빡임 있음)
                const currentSrc = iframe.src.split('?')[0];
                iframe.src = currentSrc + "?t=" + new Date().getTime();
                */
            }
        }, THIRTY_MINUTES);
    }


     // 1. 오염물질별 설명 데이터 정의 (Compose의 desc() 데이터와 동일하게 작성)
    const qualityDescriptions = {

        'no2':`이산화질소(NO2)는 주로 자동차 배기가스나 화력 발전소 등 연소 과정에서 발생하는 적갈색의 독성 기체입니다.  오존과 마찬가지로 물에 잘 녹지 않아 폐 깊숙한 곳까지 침투하며, 농도에 따라 다음과 같은 영향을 미칩니다.

               냄새: 갓 뽑아낸 독한 매연 또는 찌릿한 염소(수영장) 냄새

               [0.1 ~ 0.2]: 냄새를 감지할 수 있는 수준이며, 민감한 사람의 경우 호흡기 자극을 느낌.
               [0.5 ~ 1.0]: 짧은 노출에도 기도가 수축하기 시작하며, 호흡기 저항이 증가함.
               [1.0 ~ 3.0]: 주의 단계. 건강한 성인도 폐 기능의 유의미한 저하를 경험하며 코, 목의 통증 유발.
               [5.0 ~ 10.0]: 위험 단계. 심한 기침과 가슴 통증이 나타나며, 수 분간 노출 시 기관지염 유발 가능.
               [50 ~ 100]: 치명적 단계. 단시간 노출로도 폐포 손상 및 폐수종(폐에 물이 참) 발생 가능.
               [150 이상]: 매우 짧은 시간 노출만으로도 사망에 이를 수 있는 극독성 수준.

               폐질환자에게 미치는 영향:
                   이산화질소는 산화 스트레스를 유발하여 기도 염증을 악화시키기 때문에 폐가 약한 분들에게는 훨씬 낮은 농도에서도 위험합니다.
                   천식 환자: 기도의 과민성을 높입니다. 즉, 평소에는 괜찮았던 꽃가루나 먼지 같은 알레르기 유발 물질에 폐가 훨씬 더 격렬하게 반응하게 만듭니다. 0.2~0.3ppm 정도의 낮은 농도에서도 천식 발작 빈도가 높아질 수 있습니다.
                   만성폐쇄성폐질환(COPD): 기도의 가래 배출 능력을 저하시키고 세균 감염에 대한 저항력을 약화시킵니다. 이는 감기나 폐렴 같은 2차 감염으로 이어져 병세가 급격히 악화되는 원인이 됩니다.
                   어린이 및 영유아: 폐가 완전히 발달하지 않은 상태에서 이산화질소에 지속적으로 노출되면 성인이 된 후에도 폐 기능이 정상보다 낮아지는 '폐 성장 저해'가 발생할 수 있습니다.
               `,

        'o3':  `오존(O3)은 강력한 산화력을 가진 기체로, 농도에 따라 호흡기 및 심혈관 계통에 상당한 자극을 줍니다.  특히 폐 기능이 이미 저하된 환자들에게는 낮은 농도에서도 치명적일 수 있습니다.

                냄새: 복사기/프린터 근처의 비릿한 냄새 또는 소나기 직후의 상쾌한 듯 비릿한 풀내음

                [0.01 ~ 0.03]: 대기 중 일반적인 배경 농도로, 대다수가 감지하지 못함.
                [0.1]: 불쾌한 냄새를 느끼기 시작하며, 눈과 코의 점막에 가벼운 자극 발생.
                [0.1 ~ 0.3]: 주의 단계. 시력 저하, 두통, 가슴 압박감이 나타날 수 있으며 운동 시 숨 가쁨 현상 발생.
                [0.5 ~ 1.0]: 위험 단계. 마른 기침, 상기도 건조함, 심한 피로감을 느낌. 2시간 노출 시 폐 기능이 유의미하게 감소함.
                [1.0 ~ 3.0]: 심각 단계. 1~2시간 노출 시 기관지염, 폐부종(폐에 물이 참) 가능성. 폐렴 증세와 유사한 통증 유발.
                [10.0]: 이상단시간 노출로도 의식 불명 및 사망에 이를 수 있는 매우 위험한 수준.

                폐질환자(천식, COPD 등)에게 미치는 피해:
                    폐 건강이 취약한 분들에게 오존은 단순한 자극을 넘어 **질환의 악화(Exacerbation)**를 유발하는 기폭제가 됩니다.
                    천식 환자: 오존은 기도를 수축시키고 염증 반응을 일으킵니다. 일반인에게는 무해한 0.05ppm 수준에서도 천식 환자는 기침과 쌕쌕거림(천명)이 심해지며, 평소 복용하는 약물의 효과가 떨어질 수 있습니다.
                    만성폐쇄성폐질환(COPD) 환자: 오존 노출 시 폐의 산소 교환 능력이 급격히 떨어집니다. 이는 호흡 곤란을 심화시켜 응급실 방문이나 입원 가능성을 크게 높입니다.
                    영구적인 손상 위험: 반복적인 고농도 노출은 폐 조직의 섬유화(딱딱해짐)를 초래할 수 있는데, 기저 질환이 있는 경우 이러한 구조적 변화가 더 빠르게 진행될 수 있습니다.
             `,

        'co': `일산화탄소(CO)는 '소리 없는 살인자'라고 불릴 만큼 무색, 무취, 무미의 특성을 가집니다. 폐를 통해 혈액으로 들어간 CO는 산소를 운반하는 헤모글로빈(Hb)과 결합하여 **일산화탄소-헤모글로빈(COHb)**을 형성하는데, 그 결합력이 산소보다 약 200~250배 강해 체내 산소 공급을 차단합니다.

                냄새: 무색, 무취 (냄새가 전혀 없음)

                [50]: 허용 한계치(8시간 기준). 장시간 노출 시 가벼운 두통 가능성.
                [200]: 2~3시간 내에 가벼운 두통, 피로, 어지러움 발생.
                [400]: 1~2시간 내에 전두부 두통 및 메스꺼움. 3시간 후 생명 위험.
                [800]: 위험 단계. 45분 내에 현기증, 구토, 경련. 2시간 내 의식 불명.
                [1,600]: 심각 단계. 20분 내에 두통 및 어지러움. 2시간 내 사망 가능성.
                [3,200]: 5~10분 내에 머리가 어지럽고 30분 내에 사망.
                [12,800]: 1~3분 이내에 즉사.

                폐질환자 및 심혈관 질환자에게 미치는 피해:
                    일산화탄소는 폐 자체를 파괴하기보다 '가스 교환'의 효율성을 무너뜨립니다. 이미 폐 기능이 떨어진 환자에게는 소량의 CO도 치명적입니다.
                    산소 부족의 가속화: 만성폐쇄성폐질환(COPD)이나 폐기종 환자는 이미 혈중 산소 포화도가 낮습니다. 여기에 CO가 유입되면 남아있는 산소 운반 능력마저 마비되어 급성 호흡 부전이 올 수 있습니다.
                    심장 과부하: 산소가 부족해지면 심장은 더 많은 혈액을 보내기 위해 과하게 뜁니다. 폐가 약해 심장에 무리가 가 있는 상태(폐성심 등)에서 CO에 노출되면 심근경색이나 부정맥이 발생할 위험이 매우 높습니다.
                    낮은 농도에서의 민감성: 건강한 성인은 50ppm에서 큰 증상을 느끼지 못할 수 있지만, 폐 질환자는 같은 농도에서도 심한 가슴 통증이나 호흡 곤란을 겪을 수 있습니다.
            `,

        'so2': `이산화황(SO2)은 물에 매우 잘 녹는 수용성 기체로, 흡입 시 상기도(코, 목)의 점막에 즉각적으로 흡수되어 황산을 형성하며 강한 자극을 일으킵니다. 특히 대기 중 미세먼지와 결합하여 폐 깊숙이 침투할 경우 그 피해가 더 커집니다.

                냄새: 금방 끈 성냥의 탄내 또는 화약 냄새

                [0.1 ~ 0.5]: 민감한 사람이나 천식 환자가 장시간 노출 시 호흡 곤란을 느끼기 시작함.
                [1.0 ~ 2.0]: 건강한 성인도 불쾌한 냄새를 느끼고, 눈과 목에 가벼운 자극 발생.
                [3.0 ~ 5.0]: 주의 단계. 코와 목에 강한 자극, 마른 기침이 나며 호흡 저항이 증가함.
                [10.0 ~ 20.0]: 위험 단계. 눈 점막의 심한 통증, 재채기, 목 쉼, 가슴 압박감이 즉각적으로 나타남.
                [50.0 ~ 100]: 심각 단계. 30분~1시간 노출 시 생명이 위험할 수 있으며 폐부종 및 기관지염 발생.
                [400 ~ 500]: 짧은 노출만으로도 질식 및 폐의 심각한 손상으로 사망 가능.

                폐질환자(천식, 만성기관지염 등)에게 미치는 피해:
                    이산화황은 모든 가스 중 폐질환자에게 가장 즉각적이고 직접적인 고통을 주는 물질 중 하나입니다.
                    기도 수축(Bronchoconstriction): 이산화황은 기도를 둘러싼 근육을 수축시킵니다. 천식 환자는 일반인보다 10~20배 더 민감하게 반응하며, 단 5~10분간의 짧은 노출(0.5ppm 수준)만으로도 심한 호흡 곤란을 겪을 수 있습니다.
                    만성기관지염 환자: 점액(가래) 분비를 비정상적으로 증가시켜 기도를 폐쇄합니다. 이로 인해 기침이 멈추지 않고 산소 공급이 원활하지 않아 심부전으로 이어질 위험이 있습니다.
                    상조 효과: 이산화황이 대기 중 수분과 만나 산성 안개(Acid Mist)나 초미세먼지(황산염) 형태로 변하면, 폐포 말단까지 도달하여 조직을 직접적으로 부식시키고 염증을 일으킵니다.
            `,

        'nh3': `암모니아(NH3)는 강한 알칼리성을 띠는 부식성 가스로, 물에 매우 잘 녹는 성질이 있습니다. 흡입 시 호흡기 점막의 수분과 결합하여 강염기인 수산화암모늄(NH4OH)을 형성하며 조직을 녹여내는 화학적 화상을 입힙니다.

                냄새: 오래 방치된 공중화장실 또는 삭힌 홍어 냄새

                [5 ~ 20]: 냄새를 감지할 수 있는 수준. 대부분의 건강한 사람에게는 무해함.
                [25 ~ 50]: 노출 기준(8시간). 눈, 코, 목에 가벼운 자극이 시작됨.
                [100]: 눈과 상기도에 뚜렷한 자극. 30분 이상 노출 시 눈물과 기침 유발.
                [300 ~ 500]: 주의 단계. 즉각적인 코와 목의 통증. 호흡 시 가슴 답답함과 가쁜 숨.
                [1,700 ~ 2,500]: 위험 단계. 30분 노출 시 심각한 후두 부종 및 기관지 경련. 생명 위협.
                [5,000 ~ 10,000]: 치명적 단계. 단시간 노출로도 호흡 정지 및 질식 사망 가능.

                폐질환자에게 미치는 피해
                    암모니아는 조직을 부식시키는 성질이 강해, 폐 기능이 이미 손상된 환자에게는 회복 불가능한 타격을 줄 수 있습니다.
                    화학적 폐렴의 위험: 암모니아가 폐포까지 도달하면 상피 세포를 파괴하여 '화학적 폐렴'을 유발합니다. 폐기종이나 결핵 병력이 있는 환자는 조직 재생 능력이 떨어져 일반인보다 훨씬 심각한 염증 반응을 겪게 됩니다.
                    급성 기도 폐쇄: 천식이나 COPD 환자는 암모니아 가스의 자극에 반응하여 기도가 급격히 부어오릅니다. 이는 공기 통로를 즉각적으로 차단하여 급성 호흡 부전을 일으키는 주요 원인이 됩니다.
                    이차 감염 취약성: 암모니아 노출로 인해 기도의 점막과 섬모(먼지를 걸러내는 털)가 손상되면 외부 세균이나 바이러스에 대한 방어막이 사라집니다. 폐질환자는 이로 인해 치명적인 2차 세균성 폐렴으로 이어질 확률이 매우 높습니다.

             `,

        'h2s': `황화수소(H2S)는 달걀 썩는 냄새가 나는 무색의 독성 기체로, 화산 가스나 하수구, 폐수 처리장 등 유기물이 부패하는 곳에서 주로 발생합니다. 이 기체는 세포의 호흡 기전(세포 내 산소 이용)을 마비시키기 때문에 '화학적 질식제'로 분류됩니다. 저농도에서는 냄새로 감지되지만, 농도가 높아지면 후각 신경을 마비시켜 냄새를 맡지 못하게 하므로 매우 기만적이고 위험합니다.

                냄새: 상한 달걀(썩은 달걀) 냄새

                [0.01 ~ 0.3]: 특유의 달걀 썩는 냄새를 감지함.
                [10]: 허용 한계치(8시간 기준). 눈의 가벼운 자극.
                [50 ~ 100]: 눈과 기도에 심한 자극, 결막염, 기침, 1시간 노출 시 소화기 장애 및 현기증.
                [150 ~ 250]: 후각 마비 발생. 더 이상 냄새가 나지 않아 안전하다고 착각하게 됨 (매우 위험).
                [320 ~ 530]: 위험 단계. 폐부종 발생 가능성, 30분~1시간 노출 시 생명 위험.
                [530 ~ 1,000]: 심각 단계. 신경계 마비, 빈맥(빠른 심박), 근육 경련 및 의식 불명.
                [1,000 이상]: 치명적 단계. 단 한 번의 흡입('Knock-down')으로도 즉사 가능.

                폐질환자에게 미치는 피해:
                    황화수소는 폐포 상피 세포에 직접적인 손상을 주며, 체내 산소 대사를 방해하므로 폐 기능이 저하된 환자에게는 소량으로도 치명적입니다.
                    급성 폐수종 유발: 황화수소는 폐혈관의 투과성을 높여 폐에 물이 차게 만듭니다. 만성폐쇄성폐질환(COPD)이나 심부전이 있는 환자는 혈액 내 산소가 이미 부족한 상태에서 폐수종이 겹치면 급격한 질식 상태에 빠집니다.
                    기도 과민성 증폭: 천식 환자의 경우, 매우 낮은 농도(2~5ppm)에서도 기도가 경련을 일으키며 수축할 수 있습니다. 이는 일반적인 대기 오염 물질보다 훨씬 강력한 기폭제가 됩니다.
                    조직 재생 저해: 황화수소의 독성은 폐 조직의 미토콘드리아 기능을 억제합니다. 이미 폐 섬유화가 진행 중이거나 조직이 약해진 환자는 노출 후 폐 기능 회복이 거의 불가능할 정도로 손상될 수 있습니다.
                `,

        'pm10': `PM10 (미세먼지): 입자의 지름이 10 마이크로미터 이하인 먼지입니다. 사람의 머리카락 굵기(약 50 ~ 70 마이크로미터)보다 5~7배 정도 작습니다. 코털이나 기관지 점막에서 어느 정도 걸러지지만, 과다 노출 시 상기도 염증, 기침, 천식을 유발할 수 있습니다.

                발생 원인:
                    미세먼지는 발생하는 방식에 따라 두 가지로 나뉩니다.
                    1차적 발생: 공장, 자동차, 건설 현장에서 직접 배출되거나 흙먼지, 꽃가루와 같이 자연적으로 발생하는 경우입니다.
                    2차적 발생: 대기 중으로 배출된 황산화물(SO_x), 질소산화물(NO_x), 암모니아(NH_3) 등이 화학 반응을 일으켜 미세먼지로 변하는 경우입니다.
                    수도권 초미세먼지의 상당 부분이 이 2차 발생에 해당합니다.

                [0 ~ 30]: 좋음
                [31 ~ 80]: 보통
                [81 ~ 150]: 나쁨
                [151 ~ ]: 매우나쁨
                `,

        'pm25': `PM2.5 (초미세먼지): 입자의 지름이 2.5 마이크로미터 이하인 먼지입니다. 머리카락 굵기보다 20~30배 정도 작아 눈에 보이지 않을 정도로 매우 미세합니다. 크기가 너무 작아 폐포(허파꽈리)까지 직접 도달하며, 혈관을 타고 전신으로 퍼질 수 있습니다. 이는 심혈관계 질환, 뇌졸중, 암(1군 발암물질)의 원인이 되기도 합니다.

                    2차적 발생: 대기 중으로 배출된 황산화물(SO_x), 질소산화물(NO_x), 암모니아(NH_3) 등이 화학 반응을 일으켜 미세먼지로 변하는 경우입니다.
                    수도권 초미세먼지의 상당 부분이 이 2차 발생에 해당합니다.

                [0 ~ 15]: 좋음
                [16 ~ 35]: 보통
                [36 ~ 75]: 나쁨
                [76 ~ ]: 매우나쁨
              `
